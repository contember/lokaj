[package]
name = "lokaj"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
hmac = "0.13.0"
http-body-util = "0.1.5"
humantime-serde = "1.1.1"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
pbkdf2 = "0.13.0"
prometheus-client = "0.25.1"
rand = "0.10.3"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = { version = "0.6.5", features = ["all"] }
stringprep = "0.1.5"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
proptest = "1.12.0"
rcgen = "0.14.10"
tokio = { version = "1.54.1", features = ["test-util", "macros", "rt"] }
